name: Spark license security
on:
  push:
    branches: [usa-favor-vpn, spark-rules-validation]
    paths:
      - 'USA-FAVOR-VPN/Firebase-Backend/**'
      - '.github/workflows/spark-license-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: USA-FAVOR-VPN/Firebase-Backend/rules-tests/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-fund --no-audit
        working-directory: USA-FAVOR-VPN/Firebase-Backend/rules-tests
      - name: Real Firestore transactions and authorization rules
        run: |
          set -o pipefail
          mkdir -p ../Documentation/Validation
          ./rules-tests/node_modules/.bin/firebase emulators:exec --project demo-usa-favor --only firestore "npm test --prefix rules-tests" 2>&1 | tee ../Documentation/Validation/spark-rules-ci.log
        working-directory: USA-FAVOR-VPN/Firebase-Backend
      - name: Surface failure diagnostics without repository write access
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('USA-FAVOR-VPN/Documentation/Validation/spark-rules-ci.log')
          if p.exists():
              text=p.read_text(errors='replace')
              marker='✖ failing tests:'
              message=(text.split(marker,1)[-1] if marker in text else '\n'.join(text.splitlines()[-35:]))[:3800]
              message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=Spark test diagnostics::'+message)
          PY
      - name: Publish result count
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('USA-FAVOR-VPN/Documentation/Validation/spark-rules-ci.log').read_text().splitlines()
          summary=' | '.join(x for x in lines if any(k in x for k in ['ℹ tests','ℹ pass','ℹ fail','# tests','# pass','# fail']))
          print('::notice title=Spark suite result::'+summary)
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: spark-rules-evidence
          path: USA-FAVOR-VPN/Documentation/Validation/spark-rules-ci.log
          retention-days: 7
